# Only the frontend (3000) and API gateway (8080) are meant to be reached from other machines.
# Every other port is bound to 127.0.0.1: reachable from this host for debugging, not from the
# network. Services additionally reject any request without a gateway-signed identity.
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobgenie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobgenie_pass}
      POSTGRES_DB: ${POSTGRES_DB:-jobgenie_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobgenie_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobgenie-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobgenie-network

  eureka-server:
    build:
      context: ./JobGenie-Backend
      dockerfile: eureka-server/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - jobgenie-network

  job-service:
    build:
      context: ./JobGenie-Backend
      dockerfile: job-service/Dockerfile
    restart: always
    environment:
      # Identity enforcement (see docs/architecture.md 7.2). Same secret in every service.
      AUTH_ENFORCEMENT: ${AUTH_ENFORCEMENT:-enforce}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set in .env - see .env.example}
      USER_SERVICE_URL: http://user-service:8081
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobgenie_jobs
      DATABASE_USERNAME: ${DATABASE_USERNAME:-jobgenie_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-jobgenie_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      RESUME_SERVICE_URL: ${RESUME_SERVICE_URL:-http://resume-service:8083}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - jobgenie-network

  user-service:
    build:
      context: ./JobGenie-Backend
      dockerfile: user-service/Dockerfile
    restart: always
    environment:
      # Identity enforcement (see docs/architecture.md 7.2). Same secret in every service.
      AUTH_ENFORCEMENT: ${AUTH_ENFORCEMENT:-enforce}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set in .env - see .env.example}
      RESUME_SERVICE_URL: http://resume-service:8083
      JOB_SERVICE_URL: http://job-service:8082
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobgenie_users
      DATABASE_USERNAME: ${DATABASE_USERNAME:-jobgenie_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-jobgenie_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      # Firebase: project id must match JobGenie-Frontend/src/firebase.ts
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-jobgenie-d95c7}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY:-/app/secrets/firebase-service-account.json}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - ./app/secrets:/app/secrets:ro
    networks:
      - jobgenie-network

  resume-service:
    build:
      context: ./JobGenie-Backend
      dockerfile: resume-service/Dockerfile
    restart: always
    environment:
      # Identity enforcement (see docs/architecture.md 7.2). Same secret in every service.
      AUTH_ENFORCEMENT: ${AUTH_ENFORCEMENT:-enforce}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set in .env - see .env.example}
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobgenie_resumes
      DATABASE_USERNAME: ${DATABASE_USERNAME:-jobgenie_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-jobgenie_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - jobgenie-network

  notification-service:
    build:
      context: ./JobGenie-Backend
      dockerfile: notification-service/Dockerfile
    restart: always
    environment:
      # Identity enforcement (see docs/architecture.md 7.2). Same secret in every service.
      AUTH_ENFORCEMENT: ${AUTH_ENFORCEMENT:-enforce}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set in .env - see .env.example}
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobgenie_notifications
      DATABASE_USERNAME: ${DATABASE_USERNAME:-jobgenie_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-jobgenie_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - jobgenie-network

  ai-service:
    build: 
      context: ./JobGenie-AI
      dockerfile: Dockerfile
    restart: always
    environment:
      # Identity enforcement (see docs/architecture.md 7.2). Same secret in every service.
      AUTH_ENFORCEMENT: ${AUTH_ENFORCEMENT:-enforce}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set in .env - see .env.example}
      USER_SERVICE_URL: http://user-service:8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # LLM: Groq (free) -> Gemini (free tier) -> OpenAI (paid) -> Ollama -> rules only.
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}

      # Jobs: licensed Adzuna API, and public ATS boards (platform:token, comma-separated).
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
      JOB_BOARDS: ${JOB_BOARDS:-}

      # Automation kill switches. Safe defaults: nothing runs unattended, nothing is ever submitted.
      GLOBAL_AUTOMATION_ENABLED: ${GLOBAL_AUTOMATION_ENABLED:-false}
      DRY_RUN: ${DRY_RUN:-true}
      DISABLED_PLATFORMS: ${DISABLED_PLATFORMS:-}

      # Cache and service discovery
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      SERVICE_HOST: ai-service
      SERVICE_PORT: ${SERVICE_PORT:-8000}

      # Email for scheduled-search notifications (SendGrid, else SMTP; both optional).
      # The code reads SMTP_*; these were previously passed as MAIL_* and never reached it.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_SERVER: ${MAIL_HOST:-smtp.gmail.com}
      SMTP_PORT: ${MAIL_PORT:-587}
      SMTP_USERNAME: ${MAIL_USER:-}
      SMTP_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - jobgenie-network

  api-gateway:
    build:
      context: ./JobGenie-Backend
      dockerfile: api-gateway/Dockerfile
    restart: always
    environment:
      # Identity enforcement (see docs/architecture.md 7.2). Same secret in every service.
      AUTH_ENFORCEMENT: ${AUTH_ENFORCEMENT:-enforce}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set in .env - see .env.example}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-jobgenie-d95c7}
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      eureka-server:
        condition: service_healthy
      job-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      notification-service:
        condition: service_started
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - jobgenie-network

  frontend:
    build: 
      context: ./JobGenie-Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - jobgenie-network

volumes:
  pgdata:

networks:
  jobgenie-network:
    driver: bridge 