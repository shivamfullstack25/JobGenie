# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway

# Fix Spring Cloud Gateway compatibility issue
spring.main.web-application-type=reactive

# Eureka Client Configuration (supports both local and Docker environments)
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.discovery.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Gateway Routes Configuration
spring.cloud.gateway.discovery.locator.enabled=${GATEWAY_DISCOVERY_ENABLED:true}
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Redis Configuration for Rate Limiting
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:true}

# Management Endpoints
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
management.metrics.export.prometheus.enabled=true

# Custom Swagger UI for Spring Cloud Gateway
# (Standard springdoc-openapi doesn't work with reactive web applications)

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.userCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.userCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.resumeCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.resumeCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.resumeCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.jobCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.jobCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.jobCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.aiCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.aiCircuitBreaker.failure-rate-threshold=70
resilience4j.circuitbreaker.instances.aiCircuitBreaker.wait-duration-in-open-state=60s

# CORS Configuration
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# Logging Configuration
logging.level.org.springframework.cloud.gateway=${GATEWAY_LOG_LEVEL:INFO}
logging.level.com.jobgenie.gateway=${APP_LOG_LEVEL:INFO}
logging.pattern.console=timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} thread=%thread message="%msg"%n

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Rate Limiting Configuration
# NOTE: attempted to wire this to a real default-filters[0] RequestRateLimiter filter
# (see git history / architecture review), but this Spring Cloud Gateway version doesn't
# register a "RequestRateLimiter" GatewayFilterFactory bean even with the reactive Redis
# starter on the classpath — app fails to start with "Unable to find GatewayFilterFactory
# with name RequestRateLimiter". Reverted to keep the gateway working; these properties
# are currently unused. Root cause (see RateLimitConfig.java javadoc): that filter factory
# is only registered by GatewayAutoConfiguration once a RateLimiter bean (e.g. RedisRateLimiter)
# exists on the context, and nothing here ever declared one — not re-attempted this session
# since it requires its own build/redeploy/soak-test to confirm no crash-loop.
spring.cloud.gateway.filter.request-rate-limiter.redis-rate-limiter.replenish-rate=${RATE_LIMIT_REPLENISH:10}
spring.cloud.gateway.filter.request-rate-limiter.redis-rate-limiter.burst-capacity=${RATE_LIMIT_BURST:20}

# ThreatDetectionFilter's IP blacklist, per-minute rate counters, and client behavior profiles
# are Redis-backed (see ThreatDetectionFilter.java / RateLimitConfig.java) using the
# spring.data.redis.host/port properties above via a ReactiveStringRedisTemplate that reuses
# RedisConfig's existing RedisConnectionFactory (cast to ReactiveRedisConnectionFactory — the
# underlying Lettuce factory implements both), so that state converges across gateway replicas
# instead of living per-JVM. Key shapes: gateway:threat:blacklist:<ip> (TTL 24h), gateway:threat:ratecount:<ip>:<minuteBucket>
# (TTL 90s), gateway:threat:profile:<ip> (TTL 1h, sliding). This is unrelated to the unused
# RequestRateLimiter properties above. 