server.port=${SERVER_PORT:8084}
spring.application.name=notification-service

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.metrics.export.prometheus.enabled=true

# Swagger/OpenAPI
springdoc.swagger-ui.enabled=true
# (Optional) If you want to access Swagger UI at /swagger-ui.html, uncomment the next line
# springdoc.swagger-ui.path=/swagger-ui.html

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:jobgenie.notifications@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Service URLs (use service names for Eureka discovery)
user.service.url=${USER_SERVICE_URL:http://user-service:8081}
job.service.url=${JOB_SERVICE_URL:http://job-service:8082}
resume.service.url=${RESUME_SERVICE_URL:http://resume-service:8083}
sms.service.url=${SMS_SERVICE_URL:http://localhost:8085}
push.service.url=${PUSH_SERVICE_URL:http://localhost:8086}

# Logging Configuration
logging.level.com.jobgenie=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${SPRING_LOG_LEVEL:DEBUG}
logging.pattern.console=timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} thread=%thread message="%msg"%n

# Swagger Configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration 