# Server Configuration
server.port=${SERVER_PORT:8082}
spring.application.name=job-service

# Eureka Client Configuration
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jobgenie_jobs}
spring.datasource.username=${DATABASE_USERNAME:jobgenie_user}
spring.datasource.password=${DATABASE_PASSWORD:jobgenie_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
# Left at framework defaults (10/idle-0) before — explicit so pool sizing is a deliberate,
# visible choice rather than whatever Hikari's built-in default happens to be.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1200000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
resume.service.url=${RESUME_SERVICE_URL:http://localhost:8083}

# Logging Configuration
logging.level.com.jobgenie=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_LOG_LEVEL:INFO}
logging.pattern.console=timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} thread=%thread message="%msg"%n

# Swagger Configuration
# springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

# Kafka Configuration (Optional)
spring.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=job-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Job Service Specific Configuration
jobgenie.job.search.max-results=${JOB_SEARCH_MAX_RESULTS:50}
jobgenie.job.search.cache-ttl=${JOB_SEARCH_CACHE_TTL:300}
jobgenie.job.automation.max-concurrent-applications=${MAX_CONCURRENT_APPLICATIONS:5}
jobgenie.job.automation.rate-limit-per-minute=10
jobgenie.job.platforms.linkedin.enabled=true
jobgenie.job.platforms.linkedin.base-url=https://www.linkedin.com
jobgenie.job.platforms.indeed.enabled=true
jobgenie.job.platforms.indeed.base-url=https://www.indeed.com
jobgenie.job.platforms.naukri.enabled=true
jobgenie.job.platforms.naukri.base-url=https://www.naukri.com 