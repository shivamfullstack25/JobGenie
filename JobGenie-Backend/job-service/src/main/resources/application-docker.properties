# Server Configuration
server.port=${SERVER_PORT:8082}
spring.application.name=job-service

# Database Configuration for Docker
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/jobgenie_jobs}
spring.datasource.username=${DATABASE_USERNAME:jobgenie_user}
spring.datasource.password=${DATABASE_PASSWORD:jobgenie_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration for Docker
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Eureka Client Configuration for Docker
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://ai-service:8000}
resume.service.url=${RESUME_SERVICE_URL:http://resume-service:8083}

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging Configuration
logging.level.com.jobgenie.jobservice=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
