name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|firebase-service-account\.json$'; then
            echo "Secret files must not be committed"
            exit 1
          fi
          echo "No .env or Firebase service-account files are tracked"

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: JobGenie-Backend/pom.xml

      - name: Build and test backend
        working-directory: JobGenie-Backend
        run: mvn -B -Dspotless.skip=true package

  ai-service:
    name: AI Service (Python/FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and lint AI service
        working-directory: JobGenie-AI
        run: |
          python -m pip install --upgrade pip flake8
          python -m compileall -q .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test AI service
        working-directory: JobGenie-AI
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests -q

  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: JobGenie-Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: JobGenie-Frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: JobGenie-Frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: JobGenie-Frontend
        run: npm test

      - name: Build frontend
        working-directory: JobGenie-Frontend
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: |
          sed "s/^INTERNAL_AUTH_SECRET=.*/INTERNAL_AUTH_SECRET=ci-placeholder-secret-at-least-32-chars/" .env.example > .env
          docker compose -f docker-compose.yml config --quiet

