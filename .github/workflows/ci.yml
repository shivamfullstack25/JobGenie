name: JobGenie Development CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|firebase-service-account\.json$'; then
            echo "Secret files must not be committed"
            exit 1
          fi
          echo "No .env or Firebase service-account files are tracked"

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: JobGenie-Backend/pom.xml

      - name: Build and test backend
        working-directory: JobGenie-Backend
        run: mvn -B -Dspotless.skip=true package

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: JobGenie-Backend/*/target/*.jar
          retention-days: 7
          if-no-files-found: warn

  ai-service:
    name: AI Service (Python/FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and lint AI service
        working-directory: JobGenie-AI
        run: |
          python -m pip install --upgrade pip flake8
          python -m compileall -q .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test AI service
        working-directory: JobGenie-AI
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests -q

  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: JobGenie-Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: JobGenie-Frontend
        run: npm ci

      - name: Test frontend
        working-directory: JobGenie-Frontend
        run: npm test

      - name: Build frontend
        working-directory: JobGenie-Frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: JobGenie-Frontend/dist/
          retention-days: 7

  docker-build:
    name: Docker Build & Security
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose -f docker-compose.yml config --quiet

  development-summary:
    name: Development Summary
    runs-on: ubuntu-latest
    needs: [code-quality, backend, ai-service, frontend, docker-build]
    if: always()
    steps:
      - name: Generate development report
        run: |
          {
            echo "JobGenie Development CI Report"
            echo "Build: ${{ github.sha }}"
            echo "Code quality: ${{ needs.code-quality.result }}"
            echo "Backend: ${{ needs.backend.result }}"
            echo "AI service: ${{ needs.ai-service.result }}"
            echo "Frontend: ${{ needs.frontend.result }}"
            echo "Docker: ${{ needs.docker-build.result }}"
          } > ci-report.md

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.md
          retention-days: 7

      - name: Fail if a required job failed
        if: >-
          needs.code-quality.result != 'success' ||
          needs.backend.result != 'success' ||
          needs.ai-service.result != 'success' ||
          needs.frontend.result != 'success' ||
          needs.docker-build.result != 'success'
        run: exit 1
