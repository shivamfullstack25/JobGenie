name: 🔒 Security Scanning

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - dependencies
        - docker
        - secrets

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  dependency-scan:
    name: 🔍 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 🟢 Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 🔍 Scan Java Dependencies
      run: |
        cd JobGenie-Backend
        mvn dependency:tree
        mvn org.owasp:dependency-check-maven:check

    - name: 🔍 Scan Python Dependencies
      run: |
        cd JobGenie-AI
        pip install safety
        safety check --json --output safety-report.json

    - name: 🔍 Scan Node.js Dependencies
      run: |
        cd JobGenie-Frontend
        npm audit --audit-level moderate --json > npm-audit-report.json

    - name: 📤 Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          JobGenie-Backend/target/dependency-check-report.html
          JobGenie-AI/safety-report.json
          JobGenie-Frontend/npm-audit-report.json
        retention-days: 30

  secret-scan:
    name: 🔐 Secret Detection
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Detect Secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: .
        base: HEAD~1
        head: HEAD

    - name: 🔐 Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        config-path: .gitleaks.toml

  docker-scan:
    name: 🐳 Docker Image Security
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐳 Build Test Images
      run: |
        cd JobGenie-Backend
        docker build -f api-gateway/Dockerfile -t test-api-gateway .
        docker build -f user-service/Dockerfile -t test-user-service .
        
        cd ../JobGenie-AI
        docker build -t test-ai-service .
        
        cd ../JobGenie-Frontend
        docker build -t test-frontend .

    - name: 🔒 Trivy Vulnerability Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: test-api-gateway
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: 📤 Upload Trivy Results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  compliance-check:
    name: 📋 Compliance & Best Practices
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Check for Hardcoded Secrets
      run: |
        echo "🔍 Scanning for hardcoded secrets..."
        grep -r "password\|secret\|key\|token" . --exclude-dir={.git,node_modules,target,venv,.venv} | grep -v "example\|test\|mock" || true

    - name: 🔍 Check for Exposed Credentials
      run: |
        echo "🔍 Checking for exposed credentials..."
        find . -name "*.env" -o -name "*.properties" -o -name "*.yml" -o -name "*.yaml" | xargs grep -l "password\|secret\|key" || true

    - name: 🔍 Check Dockerfile Security
      run: |
        echo "🔍 Checking Dockerfile security..."
        find . -name "Dockerfile*" -exec echo "Checking {}" \; -exec cat {} \; -exec echo "" \;

  security-report:
    name: 📊 Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, docker-scan, compliance-check]
    if: always()
    steps:
    - name: 📥 Download Security Reports
      uses: actions/download-artifact@v4
      with:
        name: security-reports
        path: ./reports

    - name: 📊 Generate Security Summary
      run: |
        echo "🔒 Security Scan Summary" > security-summary.md
        echo "=========================" >> security-summary.md
        echo "" >> security-summary.md
        echo "Scan completed at: $(date)" >> security-summary.md
        echo "Repository: ${{ github.repository }}" >> security-summary.md
        echo "Branch: ${{ github.ref }}" >> security-summary.md
        echo "" >> security-summary.md
        
        if [ -f "./reports/safety-report.json" ]; then
          echo "✅ Python dependencies scanned" >> security-summary.md
        fi
        
        if [ -f "./reports/npm-audit-report.json" ]; then
          echo "✅ Node.js dependencies scanned" >> security-summary.md
        fi
        
        if [ -f "./reports/dependency-check-report.html" ]; then
          echo "✅ Java dependencies scanned" >> security-summary.md
        fi

    - name: 📤 Upload Security Summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
        retention-days: 30 